[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wind-turbine-pipeline"
version = "0.1.0"
description = "A testable PySpark proof-of-concept for wind-turbine telemetry"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyspark>=3.5,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.9,<1",
]

[project.scripts]
wind-turbine-pipeline = "wind_turbine_pipeline.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
